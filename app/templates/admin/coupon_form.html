{% extends "base.html" %}
{% block title %}{{ 'Edit' if coupon else 'New' }} Coupon Part — Maverick Admin{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{{ 'Edit' if coupon else 'New' }} Coupon Part</h1>
  <div class="actions"><a href="/admin/coupons" class="btn btn-outline">Cancel</a></div>
</div>
<div class="card" style="max-width:600px">
  <form method="post">
    <div class="form-row">
      <div class="form-group">
        <label for="cpn_number">CPN Number *</label>
        <input id="cpn_number" name="cpn_number" type="text" value="{{ coupon.cpn_number if coupon else '' }}" required/>
      </div>
      <div class="form-group">
        <label for="wps_id">Associated WPS</label>
        <select id="wps_id" name="wps_id">
          <option value="">None</option>
          {% for w in wps_list %}
          <option value="{{ w.id }}" {% if coupon and coupon.wps_id==w.id %}selected{% endif %}>{{ w.wps_number }}{% if w.name %} — {{ w.name }}{% endif %}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-group">
      <label for="description">Description</label>
      <input id="description" name="description" type="text" value="{{ coupon.description if coupon else '' }}"/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="material_type">Material Type</label>
        <input id="material_type" name="material_type" type="text" value="{{ coupon.material_type if coupon else '' }}"/>
      </div>
      <div class="form-group">
        <label for="size">Size</label>
        <input id="size" name="size" type="text" value="{{ coupon.size if coupon else '' }}"/>
      </div>
      <div class="form-group">
        <label for="thickness">Thickness</label>
        <input id="thickness" name="thickness" type="text" value="{{ coupon.thickness if coupon else '' }}"/>
      </div>
    </div>
    {% if coupon %}
    <div class="form-group">
      <label for="active">Status</label>
      <select id="active" name="active">
        <option value="true" {% if coupon.active %}selected{% endif %}>Active</option>
        <option value="false" {% if not coupon.active %}selected{% endif %}>Inactive</option>
      </select>
    </div>
    {% endif %}
    <button type="submit" class="btn btn-primary">{{ 'Save Changes' if coupon else 'Add CPN' }}</button>
  </form>
</div>
{% endblock %}
