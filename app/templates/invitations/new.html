{% extends "base.html" %}
{% block title %}New Invitation — Maverick{% endblock %}
{% block content %}
<div class="page-header">
  <h1>New Invitation</h1>
  <div class="actions"><a href="/invitations" class="btn btn-outline">Cancel</a></div>
</div>
<div class="card" style="max-width:520px">
  <form method="post">
    <div class="form-group">
      <label for="client_id">Client *</label>
      <select id="client_id" name="client_id" required>
        <option value="">Select client...</option>
        {% for c in clients %}
        <option value="{{ c.id }}">{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="expected_date">Expected Date</label>
      <input id="expected_date" name="expected_date" type="date"/>
    </div>
    <div class="form-group">
      <label for="notes">Notes</label>
      <textarea id="notes" name="notes" rows="3" style="width:100%;padding:9px 12px;border:1.5px solid #d1d5db;border-radius:6px;font-size:.875rem;resize:vertical"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Create Invitation</button>
  </form>
</div>
{% endblock %}
