<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — Maverick Portal</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#1a1a2e;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:#fff;border-radius:16px;padding:44px 38px;max-width:420px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,.5)}
  .brand{text-align:center;margin-bottom:30px}
  .brand h1{font-size:1.5rem;font-weight:800;color:#1a1a2e;letter-spacing:.02em}
  .brand h1 span{color:#c8102e}
  .brand p{font-size:.82rem;color:#aaa;margin-top:4px}
  .flash{background:#fde8ec;color:#9b1c2e;border-left:4px solid #c8102e;padding:10px 14px;border-radius:6px;margin-bottom:18px;font-size:.875rem}
  .form-group{margin-bottom:18px}
  label{display:block;font-size:.82rem;font-weight:700;color:#444;margin-bottom:5px}
  input{width:100%;padding:11px 13px;border:2px solid #d1d5db;border-radius:8px;font-size:.95rem;transition:border-color .15s}
  input:focus{outline:none;border-color:#c8102e;box-shadow:0 0 0 3px rgba(200,16,46,.1)}
  .btn{display:block;width:100%;padding:13px;background:#c8102e;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:6px;transition:background .15s}
  .btn:hover{background:#a50d26}
  .back{text-align:center;margin-top:20px;font-size:.82rem;color:#bbb}
  .back a{color:#c8102e}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <h1>MAVERICK <span>PORTAL</span></h1>
    <p>Staff &amp; Partner Login</p>
  </div>
  {% with messages = get_flashed_messages() %}
    {% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}
  {% endwith %}
  <form method="post">
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" autofocus required/>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required/>
    </div>
    <button class="btn" type="submit">Sign In</button>
  </form>
  <div class="back"><a href="/">&#8592; Back to check-in kiosk</a></div>
</div>
</body>
</html>
