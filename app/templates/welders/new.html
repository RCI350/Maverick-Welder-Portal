{% extends "base.html" %}
{% block title %}Add Welder — Maverick{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Add Welder</h1>
  <div class="actions"><a href="/welders" class="btn btn-outline">Cancel</a></div>
</div>
<div class="card" style="max-width:520px">
  <form method="post">
    <div class="form-row">
      <div class="form-group">
        <label for="first_name">First Name *</label>
        <input id="first_name" name="first_name" type="text" required autofocus/>
      </div>
      <div class="form-group">
        <label for="last_name">Last Name *</label>
        <input id="last_name" name="last_name" type="text" required/>
      </div>
    </div>
    <div class="form-group">
      <label for="picture_id">Picture ID</label>
      <input id="picture_id" name="picture_id" type="text"/>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" name="email" type="email"/>
    </div>
    <div class="form-group">
      <label for="mobile">Mobile</label>
      <input id="mobile" name="mobile" type="text"/>
    </div>
    <button type="submit" class="btn btn-primary">Add Welder</button>
  </form>
</div>
{% endblock %}
